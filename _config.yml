          **[craftt](https://github.com/ttasc/craftt)** was born from observing my brother's struggle to manage our Proxmox-hosted Minecraft server due to limited terminal/SSH knowledge. This web app simplifies server control with one-click start/stop, live log viewing, and command execution. Beyond solving accessibility issues, it became a learning platform where I mastered Linux container process control, built secure TLS-enabled Go servers, and engineered real-time WebSocket data streaming for log interactions.
            - <mark>Go</mark> <mark>Process handling</mark> <mark>WebSocket</mark> <mark>TLS</mark>

